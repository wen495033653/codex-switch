name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.result }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create or update draft release
        id: create_release
        uses: actions/github-script@v9
        env:
          TAG_NAME: ${{ github.ref_name }}
        with:
          result-encoding: string
          script: |
            const fs = require('fs');
            const path = require('path');

            const tag = process.env.TAG_NAME;
            const notesPath = path.join('.github/release-notes', `${tag}.md`);
            if (!fs.existsSync(notesPath)) {
              throw new Error(`Missing release notes file: ${notesPath}`);
            }

            const body = fs.readFileSync(notesPath, 'utf8').trim();
            const name = `Codex Switch ${tag}`;
            const prerelease = tag.includes('-');
            const { owner, repo } = context.repo;

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });
            const existing = releases.find(release => release.tag_name === tag);
            if (existing) {
              if (!existing.draft) {
                throw new Error(`Release ${tag} is already published (id=${existing.id}).`);
              }
              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: existing.id,
                name,
                body,
                draft: true,
                prerelease,
              });
              return String(existing.id);
            }

            const created = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              target_commitish: context.sha,
              name,
              body,
              draft: true,
              prerelease,
            });
            return String(created.data.id);

  build:
    name: Build Tauri app (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        platform:
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust (release)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: npm ci

      - name: Build and upload Tauri artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          includeUpdaterJson: false
          args: -- --locked

  publish:
    name: Publish release
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate latest.json and publish release
        uses: actions/github-script@v9
        env:
          TAG_NAME: ${{ github.ref_name }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const tag = process.env.TAG_NAME;
            const releaseId = Number(process.env.RELEASE_ID);
            const { owner, repo } = context.repo;

            const tauriConfig = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            const version = tauriConfig.version;
            const notesPath = path.join('.github/release-notes', `${tag}.md`);
            const notes = fs.readFileSync(notesPath, 'utf8').trim();

            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner,
              repo,
              release_id: releaseId,
              per_page: 100,
            });

            const findAssetPair = (label, matcher) => {
              const bundle = assets.find(asset => matcher(asset.name) && !asset.name.endsWith('.sig'));
              if (!bundle) {
                throw new Error(`Missing ${label} bundle asset on draft release ${tag}`);
              }
              const sig = assets.find(asset => asset.name === `${bundle.name}.sig`);
              if (!sig) {
                throw new Error(`Missing ${label} signature asset ${bundle.name}.sig on draft release ${tag}`);
              }
              return { bundle, sig };
            };

            const readAssetText = async (asset) => {
              const response = await github.rest.repos.getReleaseAsset({
                owner,
                repo,
                asset_id: asset.id,
                headers: { accept: 'application/octet-stream' },
              });
              const text = typeof response.data === 'string'
                ? response.data
                : Buffer.from(response.data).toString('utf8');
              return text.trim();
            };

            const releaseDownloadUrl = (assetName) =>
              `https://github.com/${owner}/${repo}/releases/download/${tag}/${encodeURIComponent(assetName)}`;

            const mac = findAssetPair('macOS aarch64', name => name.endsWith('_aarch64.app.tar.gz'));
            const win = findAssetPair('Windows x64 NSIS', name => name.endsWith('_x64-setup.exe'));

            const [macSig, winSig] = await Promise.all([
              readAssetText(mac.sig),
              readAssetText(win.sig),
            ]);

            const macEntry = { signature: macSig, url: releaseDownloadUrl(mac.bundle.name) };
            const winEntry = { signature: winSig, url: releaseDownloadUrl(win.bundle.name) };

            const manifest = {
              version,
              notes,
              pub_date: new Date().toISOString(),
              platforms: {
                'darwin-aarch64': macEntry,
                'darwin-aarch64-app': macEntry,
                'windows-x86_64': winEntry,
                'windows-x86_64-nsis': winEntry,
              },
            };

            const existingManifest = assets.find(asset => asset.name === 'latest.json');
            if (existingManifest) {
              await github.rest.repos.deleteReleaseAsset({
                owner,
                repo,
                asset_id: existingManifest.id,
              });
            }

            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: releaseId,
              name: 'latest.json',
              data: JSON.stringify(manifest, null, 2),
              headers: { 'content-type': 'application/json' },
            });

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: releaseId,
              draft: false,
            });
